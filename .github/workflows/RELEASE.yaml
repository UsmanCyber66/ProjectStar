name: Cross-Platform Compile and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: StarLinuxUbuntu
            compile_cmd: g++ -O3 src/star.cpp -o StarLinuxUbuntu
          - os: windows-latest
            artifact_name: StarWindows11.exe
            compile_cmd: g++ -O3 src/star.cpp -o StarWindows11.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile C++ Program
        run: ${{ matrix.compile_cmd }}

      - name: Archive Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: zip ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}

      - name: Archive Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Generate Release Tag
        id: tag
        run: |
          echo "tag_name=v1.0.$(date +%Y%m%d%H%M)" >> $env:GITHUB_OUTPUT || echo "tag_name=v1.0.$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Star Release ${{ steps.tag.outputs.tag_name }}"
          body: "Automated cross-platform build for Star."
          files: |
            ${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

