name: Cross-Platform Compile and Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v', e.g., v1.0.0

permissions:
  contents: write # Required to create the GitHub release and upload assets

jobs:
  build-and-release:
    strategy:
      matrix:
        # Run two parallel builds on different operating systems
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: StarLinuxUbuntu
            compile_cmd: g++ -O3 main.cpp -o StarLinuxUbuntu
          - os: windows-latest
            artifact_name: StarWindows11
            # Windows runner uses PowerShell by default; g++ is pre-installed via MinGW
            compile_cmd: g++ -O3 main.cpp -o StarWindows11

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Compile your C++ file using the OS-specific command
      - name: Compile C++ Program
        run: ${{ matrix.compile_cmd }}

      # 2. Package the compiled file into a zip archive
      - name: Archive Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: zip ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}

      - name: Archive Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.artifact_name }}.zip

      # 3. Create GitHub Release and upload the zip file
      # This action automatically handles uploading multiple files from separate jobs to the same release tag.
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
